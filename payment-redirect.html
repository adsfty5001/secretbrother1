<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결제 결과 확인 - 시크릿클래스</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <main class="max-w-xl mx-auto px-4 py-16">
    <div class="bg-white border border-gray-200 rounded-2xl shadow p-8">
      <h1 class="text-2xl font-bold mb-2">결제 결과 확인</h1>
      <p id="status" class="text-gray-600 mb-6">결제 상태를 확인하고 있습니다...</p>

      <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 text-sm text-gray-700 mb-6">
        <div class="mb-1"><span class="font-bold">paymentId</span>: <span id="pid">-</span></div>
        <div class="mb-1"><span class="font-bold">code</span>: <span id="code">-</span></div>
        <div><span class="font-bold">message</span>: <span id="msg">-</span></div>
      </div>

      <a id="next" class="hidden w-full inline-flex items-center justify-center gap-2 bg-indigo-600 text-white font-bold px-6 py-4 rounded-xl hover:bg-indigo-700 transition"
         href="#" rel="noopener">
        네이버폼 작성하러 가기
      </a>

      <p class="text-xs text-gray-400 mt-4 leading-relaxed">
        모바일 결제는 결제창에서 이 페이지로 다시 이동(redirect)됩니다. 결제 검증은 별도의 서버에서 결제 조회 API로 처리하는 것을 권장합니다.
      </p>
    </div>
  </main>

  <script>
    (function () {
      const qs = new URLSearchParams(location.search);
      const paymentId = qs.get("paymentId") || "";
      const code = qs.get("code") || "";
      const message = qs.get("message") || qs.get("pgMessage") || "";

      document.getElementById("pid").textContent = paymentId || "-";
      document.getElementById("code").textContent = code || "-";
      document.getElementById("msg").textContent = message || "-";

      const naverFormUrl = "YOUR_NAVER_FORM_URL";

      const statusEl = document.getElementById("status");
      const nextEl = document.getElementById("next");

      if (code) {
        statusEl.textContent = "결제가 완료되지 않았습니다. (오류)";
        statusEl.className = "text-red-600 font-bold mb-6";
        return;
      }
      statusEl.textContent = "결제 요청이 접수되었습니다. 아래 폼을 작성해 주세요.";
      statusEl.className = "text-green-700 font-bold mb-6";

      if (naverFormUrl) {
        const u = new URL(naverFormUrl);
        if (paymentId) u.searchParams.set("paymentId", paymentId);
        nextEl.href = u.toString();
        nextEl.classList.remove("hidden");
      }
    })();
  </script>
</body>
</html>
