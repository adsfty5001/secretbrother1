<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>전체 수강생 후기 - 시크릿클래스</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="./styles.css" rel="stylesheet"/>
<!-- Firebase config (둘 중 존재하는 경로를 사용) -->
<script src="./config.js"></script>

<style>
    .card-hover { transition: transform .15s ease, box-shadow .15s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.06); }
  </style>
</head>
<body class="bg-white">
<header class="sticky top-0 z-20 bg-white/80 backdrop-blur border-b border-gray-200">
<div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
<div class="flex items-center gap-3">
<a class="text-gray-700 font-semibold hover:underline" href="./index.html">← 메인으로</a>
<span class="text-gray-300">|</span>
<h1 class="text-lg font-bold text-gray-900">전체 수강생 후기</h1>
</div>
<div class="flex items-center gap-2">
<input class="w-64 max-w-[60vw] px-3 py-2 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-200" id="searchInput" placeholder="후기 검색 (제목/작성자/내용)" type="text"/>
<select class="px-3 py-2 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-200" id="sortSelect">
<option value="recent">최신순</option>
<option value="views">조회수순</option>
<option value="rating">별점순</option>
</select><button class="ml-2 px-4 py-2 rounded-xl bg-black text-white font-semibold hover:bg-gray-900" id="writeBtn">수강생 후기 쓰기</button><span class="ml-2 text-xs text-gray-500" id="writeHint"></span>
</div>
</div>
</header>
<main class="max-w-6xl mx-auto px-4 py-8">
<div class="text-gray-600 mb-4" id="totalCount"></div>
<div id="statusMsg">불러오는 중…</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="list"></div>
<div class="mt-8 flex items-center justify-between">
<button class="px-4 py-2 rounded-xl border border-gray-200 hover:bg-gray-50" id="prevBtn">이전</button>
<div class="text-gray-600" id="pageInfo"></div>
<button class="px-4 py-2 rounded-xl border border-gray-200 hover:bg-gray-50" id="nextBtn">다음</button>
</div>
</main>
<!-- Review Modal -->
<div class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50" id="reviewModal">
<div class="bg-white w-[min(900px,94vw)] max-h-[90vh] rounded-2xl shadow-xl overflow-hidden">
<div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
<div>
<div class="text-sm text-gray-500">후기 상세</div>
<div class="text-lg font-bold text-gray-900" id="modalTitle"></div>
<div class="text-sm text-gray-500 mt-1">
<span id="modalMeta"></span>
</div>
</div>
<button class="text-gray-400 hover:text-gray-700 text-2xl leading-none" id="modalClose">×</button>
</div>
<div class="px-6 py-5 overflow-y-auto" style="max-height: calc(90vh - 150px);">
<div class="text-gray-800" id="modalContent"></div>
</div>
<div class="px-6 py-4 border-t border-gray-200 flex items-center justify-end">
<button class="px-5 py-3 rounded-xl bg-gray-900 text-white font-semibold" id="modalClose2">닫기</button>
</div>
</div>
</div>
<div class="hidden fixed inset-0 z-[100] bg-black/50 flex items-center justify-center p-4" id="writeModal">
<div class="bg-white w-full max-w-lg rounded-2xl p-6 shadow-2xl relative">
<button class="absolute right-4 top-4 text-gray-400 hover:text-black" id="writeClose">✕</button>
<h2 class="text-xl font-bold mb-4">수강생 후기 작성</h2>
<div class="space-y-3">
<input class="w-full px-3 py-2 rounded-xl border border-gray-200" id="wTitle" placeholder="후기 제목"/>
<div class="grid grid-cols-2 gap-2">
<input class="w-full px-3 py-2 rounded-xl border border-gray-200" id="wAuthor" placeholder="작성자(이름)"/>
<select class="w-full px-3 py-2 rounded-xl border border-gray-200" id="wRating">
<option value="5">★★★★★ (5)</option>
<option value="4">★★★★☆ (4)</option>
<option value="3">★★★☆☆ (3)</option>
<option value="2">★★☆☆☆ (2)</option>
<option value="1">★☆☆☆☆ (1)</option>
</select>
</div>
<input class="w-full px-3 py-2 rounded-xl border border-gray-200" id="wOriginal" placeholder="원본 링크(선택)"/>
<textarea class="w-full px-3 py-2 rounded-xl border border-gray-200 h-40" id="wContent" placeholder="후기 내용"></textarea>
<div class="text-sm text-red-600" id="writeMsg"></div>
<button class="w-full py-3 rounded-xl bg-black text-white font-semibold hover:bg-gray-900" id="writeSubmit">등록하기</button>
<p class="text-xs text-gray-500">등록된 후기는 운영 목적상 저장됩니다.</p>
</div>
</div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import {
    getFirestore, collection, getDocs, doc, getDoc, addDoc,
    serverTimestamp, query, orderBy, runTransaction
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const CONFIG = window.SECRETCLASS_CONFIG || window.SECRETCLASS_FIREBASE_CONFIG || window.FIREBASE_CONFIG || window.firebaseConfig;
  const app = initializeApp(CONFIG);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = (id) => document.getElementById(id);

  const decodeHtml = (s) => {
    const t = document.createElement("textarea");
    t.innerHTML = String(s ?? "");
    return t.value;
  };
  const escapeHtml = (s) => String(s||"")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
  const normalizeText = (s) => String(s || "")
    .replace(/\\r\\n/g, "\n")
    .replace(/\\n/g, "\n")
    .replace(/\\r/g, "\n")
    .replace(/\r\n/g, "\n")
    .replace(/\r/g, "\n")
    .replace(/\u00A0/g, " ")
    .replace(/\s+\n/g, "\n")
    .replace(/\n{3,}/g, "\n\n")
    .replace(/￦r￦n/g, "\n")
    .replace(/￦n/g, "\n")
    .replace(/￦r/g, "\n")
    .trim();

  const ratingFor = (id) => {
    let h = 0;
    const str = String(id || "");
    for (let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) >>> 0;
    return (h % 20 === 0) ? 4 : 5; // 95% 5점, 5% 4점
  };

  function renderStars(score){
    const s = Number(score) || 0;
    const full = Math.max(0, Math.min(5, Math.round(s)));
    let html = "";
    for(let i=0;i<5;i++){
      html += `<span class="${i<full ? "text-yellow-400" : "text-gray-300"}">★</span>`;
    }
    return `<span class="inline-flex items-center gap-0.5">${html}</span><span class="ml-2 text-sm text-gray-500">${full.toFixed(1)}</span>`;
  }

  function fmtDate(dateStr){
    return String(dateStr || "").slice(0,10);
  }

  
  function htmlToPlainText(htmlStr){
    let s = decodeHtml(htmlStr || "");
    // Convert common HTML formatting to plain text paragraphs (display-only)
    s = s.replace(/<br\s*\/?\s*>/gi, "\n");
    s = s.replace(/<\/p\s*>/gi, "\n\n");
    s = s.replace(/<p[^>]*>/gi, "");
    // Strip any remaining tags
    s = s.replace(/<[^>]+>/g, "");
    return normalizeText(s);
  }

function excerptFromHtml(htmlStr, maxLen=140){
    const div = document.createElement("div");
    div.innerHTML = htmlStr || "";
    const txt = normalizeText(div.textContent || "");
    if(txt.length <= maxLen) return txt;
    return txt.slice(0, maxLen) + "…";
  }

  async function loadReviewsJson(){
    // Prefer canonical path: /data/reviews.json (repo root /data/reviews.json)
    // Cache-bust to avoid stale CDN caches during deployment.
    const ts = Date.now();
    const candidates = [
      `/data/reviews.json?v=${ts}`,
      `./data/reviews.json?v=${ts}`,
      `./reviews.json?v=${ts}`,
      `/reviews.json?v=${ts}`
    ];

    let lastErr = null;
    for(const url of candidates){
      try{
        const res = await fetch(url, { cache: "no-store" });
        if(!res.ok) throw new Error(`${url} -> HTTP ${res.status}`);
        const data = await res.json();
        if(!Array.isArray(data)) throw new Error(`${url} -> JSON is not an array`);
        return data;
      }catch(err){
        lastErr = err;
      }
    }
    console.error("[reviews] Failed to load reviews.json from all candidates.", lastErr);
    return [];
  }

  function normalizeReview(r){
    const id = String(r.id ?? r.reviewId ?? r.key ?? "");
    const title = String(r.title ?? "");
    const author = String(r.author ?? r.writer ?? r.name ?? r.userName ?? r.username ?? r.nickname ?? r.displayName ?? "");
    const date = String(r.date ?? r.createdAt ?? "");
    let contentHtml = decodeHtml(r.contentHtml ?? r.content ?? "");
    // Remove literal escape sequences that appear in some data (e.g., "\r\n\r\n")
    contentHtml = contentHtml
      .replace(/\r\n/g, "")
      .replace(/\n/g, "")
      .replace(/\r/g, "");
    const baseViews = Number(r.views ?? 0) || 0;
    return { id, title, author, date, contentHtml, baseViews, source:"json", rating: Number(r.rating ?? 0) || null };
  }

  function tsToDateStr(ts){
    try{
      if(!ts) return "";
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toISOString().slice(0,10);
    }catch(e){
      return "";
    }
  }

  async function loadFirestoreReviews(){
    try{
      const q = query(collection(db, "reviews"), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);
      return snap.docs.map(d=>{
        const data = d.data() || {};
        return {
          id: d.id,
          title: String(data.title ?? ""),
          author: String(data.author ?? data.writer ?? data.name ?? ""),
          date: tsToDateStr(data.createdAt),
          contentHtml: decodeHtml(data.contentHtml ?? data.content ?? ""),
          baseViews: 0,
          source:"firestore",
          rating: Number(data.rating ?? 0) || null
        };
      });
    }catch(e){
      try{
        const snap = await getDocs(collection(db, "reviews"));
        return snap.docs.map(d=>{
          const data = d.data() || {};
          return {
            id: d.id,
            title: String(data.title ?? ""),
            author: String(data.author ?? data.writer ?? data.name ?? ""),
            date: tsToDateStr(data.createdAt),
            contentHtml: decodeHtml(data.contentHtml ?? data.content ?? ""),
            baseViews: 0,
            source:"firestore",
            rating: Number(data.rating ?? 0) || null
          };
        });
      }catch(e2){
        return [];
      }
    }
  }

  // delta views from reviewViews/{reviewId}.views
  const viewDeltaCache = new Map();
  async function getDeltaViews(reviewId){
    if(viewDeltaCache.has(reviewId)) return viewDeltaCache.get(reviewId);
    try{
      const ref = doc(db, "reviewViews", reviewId);
      const snap = await getDoc(ref);
      const delta = snap.exists() ? (Number(snap.data().views) || 0) : 0;
      viewDeltaCache.set(reviewId, delta);
      return delta;
    }catch(e){
      return 0;
    }
  }
  async function incrementDeltaViews(reviewId){
    const ref = doc(db, "reviewViews", reviewId);
    const next = await runTransaction(db, async (tx)=>{
      const snap = await tx.get(ref);
      if(!snap.exists()){
        tx.set(ref, { views: 1 }); // create exactly 1
        return 1;
      }
      const cur = Number(snap.data().views) || 0;
      const n = cur + 1; // update +1
      tx.update(ref, { views: n });
      return n;
    });
    viewDeltaCache.set(reviewId, next);
    return next;
  }

  // ---- UI helpers ----
  function openModal(id){
    const el=$(id);
    if(!el) return;
    el.classList.remove("hidden");
    el.classList.add("flex");
    document.body.classList.add("overflow-hidden");
  }
  function closeModal(id){
    const el=$(id);
    if(!el) return;
    el.classList.add("hidden");
    el.classList.remove("flex");
    document.body.classList.remove("overflow-hidden");
  }

  // ---- State ----
  let ALL = [];
  let FILTERED = [];
  let page = 1;
  const PAGE_SIZE = 10;

  function getRating(r){
    return r.rating || ratingFor(r.id);
  }

  function applyFilter(){
    const q = ($("searchInput")?.value || "").trim().toLowerCase();
    const sort = $("sortSelect")?.value || "recent";

    let arr = [...ALL];

    if(q){
      arr = arr.filter(r=>{
        const t = (r.title||"").toLowerCase();
        const a = (r.author||"").toLowerCase();
        const c = normalizeText((r.contentHtml||"")).toLowerCase();
        return t.includes(q) || a.includes(q) || c.includes(q);
      });
    }

    if(sort==="recent"){
      arr.sort((a,b)=> (b.date||"").localeCompare(a.date||""));
    } else if(sort==="rating"){
      arr.sort((a,b)=> getRating(b) - getRating(a));
    } else if(sort==="views"){
      arr.sort((a,b)=> ( (b.baseViews+(viewDeltaCache.get(b.id)||0)) - (a.baseViews+(viewDeltaCache.get(a.id)||0)) ));
    }

    FILTERED = arr;
    page = 1;
  }

  async function renderPage(){
    const list = $("list");
    if(!list) return;

    const totalPages = Math.max(1, Math.ceil(FILTERED.length / PAGE_SIZE));
    page = Math.min(page, totalPages);

    const start = (page-1)*PAGE_SIZE;
    const slice = FILTERED.slice(start, start+PAGE_SIZE);

    list.innerHTML = "";

    for(const r of slice){
      const delta = await getDeltaViews(r.id);
      const totalViews = r.baseViews + delta;
      const rating = getRating(r);

      const card = document.createElement("div");
      card.className = "review-card bg-white rounded-2xl border border-gray-100 shadow-sm p-6 hover:shadow-md transition cursor-pointer flex flex-col";
      card.innerHTML = `
        <div>
          <div class="flex items-start justify-between gap-3">
            <div class="text-lg font-bold text-gray-900 line-clamp-2">${escapeHtml(r.title)}</div>
            <div class="text-sm shrink-0">${renderStars(rating)}</div>
          </div>
          <div class="mt-2 text-sm text-gray-500">${fmtDate(r.date)}${r.author ? " · "+escapeHtml(r.author) : ""}</div>
          <div class="mt-3 text-sm text-gray-700 leading-relaxed line-clamp-3">${escapeHtml(excerptFromHtml(r.contentHtml, 220))}</div>
        </div>
        <div class="mt-auto pt-4 text-sm text-gray-500">조회수 <span id="views-a-${escapeHtml(r.id)}" class="font-semibold text-gray-800">${totalViews}</span></div>
      `;
      card.addEventListener("click", ()=> openDetail(r.id));
      list.appendChild(card);
    }

    $("pageInfo") && ($("pageInfo").textContent = `${page} / ${totalPages}`);
    $("prevBtn") && ($("prevBtn").disabled = page<=1);
    $("nextBtn") && ($("nextBtn").disabled = page>=totalPages);
  }

  async function openDetail(id){
    const r = ALL.find(x=>x.id===id);
    if(!r) return;

    const rating = getRating(r);

    $("modalTitle") && ($("modalTitle").textContent = r.title);
    $("modalMeta") && ($("modalMeta").innerHTML = `
      <div class="flex flex-wrap items-center gap-3">
        <span class="text-sm text-gray-500">${fmtDate(r.date)}${r.author ? " · "+escapeHtml(r.author) : ""}</span>
        <span class="text-sm">${renderStars(rating)}</span>
        <span class="text-sm text-gray-500">조회수 <span id="modalViews" class="font-semibold text-gray-800">-</span></span>
      </div>
    `);

    const content = $("modalContent");
    if(content){
      const raw = (r.contentHtml ?? "");
      const cleaned = htmlToPlainText(raw);
      content.textContent = cleaned;
      content.style.whiteSpace = "pre-wrap";
      content.style.wordBreak = "keep-all";
      content.style.lineHeight = "1.7";
    }

    let delta = await getDeltaViews(id);
    try{
      delta = await incrementDeltaViews(id);
    }catch(e){}
    const total = r.baseViews + (Number(delta)||0);

    const modalViewsEl = document.getElementById("modalViews");
    if(modalViewsEl) modalViewsEl.textContent = String(total);

    const span = document.getElementById(`views-a-${id}`);
    if(span) span.textContent = String(total);

    openModal("reviewModal");
  }

  $("modalClose")?.addEventListener("click", ()=>closeModal("reviewModal"));
  $("modalClose2")?.addEventListener("click", ()=>closeModal("reviewModal"));

  // ---- Write review ----
  async function canWrite(){
    const user = auth.currentUser;
    if(!user) return { ok:false, reason:"로그인이 필요합니다." };
    try{
      const mSnap = await getDoc(doc(db, "members", user.uid));
      const ps = mSnap.exists() ? (mSnap.data().payStatus || "") : "";
      if(ps !== "complete") return { ok:false, reason:"결제 완료자만 작성 가능합니다." };
      return { ok:true, user, member: mSnap.data() };
    }catch(e){
      return { ok:false, reason:"결제 상태 확인에 실패했습니다." };
    }
  }

  // 후기 작성: 로그인/권한 확인 없이 네이버폼으로 바로 이동
  $("writeBtn")?.addEventListener("click", ()=>{
    window.open("https://naver.me/5JGkO1vW", "_blank");
  });

  $("writeClose")?.addEventListener("click", ()=>closeModal("writeModal"));

  $("writeSubmit")?.addEventListener("click", async ()=>{
    const chk = await canWrite();
    if(!chk.ok){
      alert(chk.reason);
      return;
    }
    const title = ($("wTitle")?.value || "").trim();
    const author = ($("wAuthor")?.value || "").trim();
    const rating = Number($("wRating")?.value || 5) || 5;
    const original = ($("wOriginal")?.value || "").trim(); // optional
    const content = ($("wContent")?.value || "").trim();
    const msg = $("writeMsg");
    if(msg) msg.textContent = "";

    if(!title) return (msg ? msg.textContent="제목을 입력해 주세요." : alert("제목을 입력해 주세요."));
    if(!content) return (msg ? msg.textContent="내용을 입력해 주세요." : alert("내용을 입력해 주세요."));

    const contentHtml = content.split("\n").map(line=>escapeHtml(line)).join("<br/>");

    try{
      await addDoc(collection(db, "reviews"), {
        title,
        contentHtml,
        author: author || (chk.member?.name || chk.user.displayName || chk.user.email || ""),
        originalLink: original || "",
        rating: Math.max(1, Math.min(5, Math.round(rating))),
        createdAt: serverTimestamp()
      });
      alert("후기가 등록되었습니다.");
      closeModal("writeModal");
      await bootstrap();
    }catch(e){
      console.error(e);
      if(msg) msg.textContent = "등록에 실패했습니다. 잠시 후 다시 시도해 주세요.";
      else alert("등록에 실패했습니다.");
    }
  });

  // ---- Events ----
  $("searchInput")?.addEventListener("input", async ()=>{
    applyFilter();
    await renderPage();
  });
  $("sortSelect")?.addEventListener("change", async ()=>{
    applyFilter();
    await renderPage();
  });
  $("prevBtn")?.addEventListener("click", async ()=>{
    page = Math.max(1, page-1);
    await renderPage();
  });
  $("nextBtn")?.addEventListener("click", async ()=>{
    const totalPages = Math.max(1, Math.ceil(FILTERED.length / PAGE_SIZE));
    page = Math.min(totalPages, page+1);
    await renderPage();
  });

  async function bootstrap(){
    const jsonRaw = await loadReviewsJson();
    const jsonReviews = (jsonRaw || []).map(normalizeReview).filter(r=>r.id);

    const fsReviews = await loadFirestoreReviews();

    const map = new Map();
    for(const r of jsonReviews) map.set(r.id, r);
    for(const r of fsReviews) map.set(r.id, r);

    ALL = Array.from(map.values());

    const totalCountEl = $("#totalCount");
    if(totalCountEl) totalCountEl.textContent = `총 ${ALL.length}개`;
    if(statusMsg) statusMsg.textContent = "";

    applyFilter();
    await renderPage();
  }

  onAuthStateChanged(auth, ()=>{ /* UI 변화만 */ });

  await bootstrap();
</script>
</body>
</html>
