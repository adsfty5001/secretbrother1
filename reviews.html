<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>전체 후기 | Secretclass</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <a href="./index.html" class="font-extrabold tracking-tight text-lg">Secretclass</a>
      <a href="./index.html" class="text-sm text-gray-600 hover:underline">메인으로</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-10">
    <div class="flex items-end justify-between gap-3">
      <div>
        <h1 class="text-2xl font-extrabold">전체 후기</h1>
        <p class="text-sm text-gray-500 mt-1">카드를 클릭하면 상세 모달이 열리고, 조회수가 누적됩니다.</p>
      </div>
    </div>

    <div id="reviews-grid" class="mt-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="text-sm text-gray-500">불러오는 중…</div>
    </div>
  </main>

  <!-- Review Modal -->
  <div id="reviewModal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden">
      <div class="p-4 border-b flex items-start justify-between gap-3">
        <div>
          <div id="reviewModalTitle" class="font-extrabold text-lg">제목</div>
          <div class="mt-1 text-xs text-gray-500">
            <span id="reviewModalDate">-</span> · 조회수 <span id="reviewModalViews">0</span>
          </div>
        </div>
        <button id="review-close" class="p-2 rounded hover:bg-gray-100" aria-label="닫기">✕</button>
      </div>
      <div id="reviewModalContent" class="p-5 text-sm leading-7 whitespace-pre-wrap"></div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script type="module" src="./reviews_page.js"></script>
</body>
</html>
