<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Secretclass</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <a href="./index.html" class="font-extrabold tracking-tight text-lg">Secretclass</a>

      <!-- Guest -->
      <div id="auth-guest" class="flex items-center gap-2">
        <button id="btn-login" class="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold">로그인</button>
        <button id="btn-signup" class="px-3 py-2 rounded-lg bg-white border text-sm font-semibold">회원가입</button>
      </div>

      <!-- Logged-in -->
      <div id="auth-user" class="hidden items-center gap-2">
        <span class="text-sm text-gray-600">안녕하세요, <b id="user-name-display">회원</b>님</span>
        <button id="btn-my-classroom" class="px-3 py-2 rounded-lg bg-gray-900 text-white text-sm font-semibold">강의실</button>
        <button id="btn-admin-open" class="hidden px-3 py-2 rounded-lg bg-emerald-600 text-white text-sm font-semibold">관리자</button>
        <button id="btn-logout" class="px-3 py-2 rounded-lg border text-sm font-semibold">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-10 space-y-10">
    <section class="bg-white border rounded-2xl p-6">
      <div class="flex items-end justify-between gap-3">
        <div>
          <h1 class="text-2xl font-extrabold">BEST 후기</h1>
          <p class="text-sm text-gray-500 mt-1">카드를 클릭하면 상세 모달이 열리고, 조회수가 누적됩니다.</p>
        </div>
        <button id="btn-all-reviews" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold">
          전체후기 보기
        </button>
      </div>

      <div id="best-reviews-container" class="mt-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- JS 렌더링 -->
        <div class="text-sm text-gray-500">불러오는 중…</div>
      </div>
    </section>

    <section class="bg-white border rounded-2xl p-6">
      <h2 class="text-xl font-bold">사용 안내</h2>
      <ul class="mt-3 text-sm text-gray-700 list-disc pl-5 space-y-1">
        <li>Firebase 설정은 <code class="px-1 bg-gray-100 rounded">config.js</code>에서 관리합니다.</li>
        <li>리뷰 원본 데이터는 <code class="px-1 bg-gray-100 rounded">/data/reviews.json</code>에서 불러옵니다.</li>
        <li>조회수는 Firestore <code class="px-1 bg-gray-100 rounded">artifacts/{APP_ID}/public/data/reviewCounters</code>에 <code class="px-1 bg-gray-100 rounded">deltaViews</code>로 누적됩니다.</li>
      </ul>
    </section>
  </main>

  <!-- Auth Modal -->
  <div id="authModal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden" role="dialog" aria-modal="true">
      <div class="p-4 border-b flex items-center justify-between">
        <div class="font-bold">로그인 / 회원가입</div>
        <button id="auth-close" class="p-2 rounded hover:bg-gray-100" aria-label="닫기">✕</button>
      </div>

      <div class="p-4">
        <div class="flex gap-3 border-b">
          <button id="tab-login" class="flex-1 py-2 border-b-2 font-semibold">로그인</button>
          <button id="tab-signup" class="flex-1 py-2 border-b-2 text-gray-500 font-semibold">회원가입</button>
        </div>

        <div id="panel-login" class="pt-4 space-y-3">
          <input id="login-email" class="w-full px-3 py-2 border rounded-lg" placeholder="이메일" autocomplete="email" />
          <input id="login-pw" type="password" class="w-full px-3 py-2 border rounded-lg" placeholder="비밀번호" autocomplete="current-password" />
          <button id="do-login" class="w-full py-2 rounded-lg bg-indigo-600 text-white font-semibold">로그인</button>
        </div>

        <div id="panel-signup" class="hidden pt-4 space-y-3">
          <input id="signup-name" class="w-full px-3 py-2 border rounded-lg" placeholder="이름" autocomplete="name" />
          <input id="signup-email" class="w-full px-3 py-2 border rounded-lg" placeholder="이메일" autocomplete="email" />
          <input id="signup-pw" type="password" class="w-full px-3 py-2 border rounded-lg" placeholder="비밀번호(6자 이상)" autocomplete="new-password" />
          <button id="do-signup" class="w-full py-2 rounded-lg bg-gray-900 text-white font-semibold">회원가입</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Review Modal -->
  <div id="reviewModal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden">
      <div class="p-4 border-b flex items-start justify-between gap-3">
        <div>
          <div id="reviewModalTitle" class="font-extrabold text-lg">제목</div>
          <div class="mt-1 text-xs text-gray-500">
            <span id="reviewModalDate">-</span> · 조회수 <span id="reviewModalViews">0</span>
          </div>
        </div>
        <button id="review-close" class="p-2 rounded hover:bg-gray-100" aria-label="닫기">✕</button>
      </div>
      <div id="reviewModalContent" class="p-5 text-sm leading-7 whitespace-pre-wrap"></div>
    </div>
  </div>

  <!-- Config + App -->
  <script src="./config.js"></script>
  <script type="module" src="./index.js"></script>
</body>
</html>
