<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>관리자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-gray-50">
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="font-bold text-gray-900">관리자 패널</div>
      <div class="flex gap-2">
        <button id="btn-home" class="px-3 py-2 rounded-lg bg-white border border-gray-200 text-sm hover:bg-gray-50">메인</button>
        <button id="btn-logout" class="px-3 py-2 rounded-lg bg-gray-900 text-white text-sm hover:bg-gray-800">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-10">
    <h1 class="text-xl font-bold text-gray-900 mb-4">회원 및 결제 관리</h1>
    <div id="member-list" class="space-y-3"></div>
    <p class="text-sm text-gray-500 mt-6">
      관리자 이메일은 <code class="bg-gray-100 px-1 rounded">config.js</code>의 <code class="bg-gray-100 px-1 rounded">window.ADMIN_EMAILS</code>에 등록되어 있어야 합니다.
    </p>
  </main>

  <script src="./config.js"></script>
  <script type="module" src="./admin.js"></script>
</body>
</html>
