<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>나의 강의실</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-gray-50">
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="font-bold text-gray-900">나의 강의실</div>
      <div class="flex gap-2">
        <button id="btn-home" class="px-3 py-2 rounded-lg bg-white border border-gray-200 text-sm hover:bg-gray-50">메인</button>
        <button id="btn-logout" class="px-3 py-2 rounded-lg bg-gray-900 text-white text-sm hover:bg-gray-800">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-10 space-y-6">
    <section class="bg-white border border-gray-200 rounded-2xl p-6">
      <div class="text-sm text-gray-500">계정</div>
      <div class="mt-2 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <div class="text-xs text-gray-500">이메일</div>
          <div id="user-email" class="font-semibold text-gray-900">-</div>
        </div>
        <div>
          <div class="text-xs text-gray-500">이름</div>
          <div id="user-name" class="font-semibold text-gray-900">-</div>
        </div>
        <div>
          <div class="text-xs text-gray-500">결제 상태</div>
          <div id="pay-status" class="font-semibold text-gray-900">none</div>
        </div>
      </div>
    </section>

    <section id="gate" class="bg-white border border-gray-200 rounded-2xl p-6">
      <h2 class="text-lg font-bold text-gray-900">수강권이 필요합니다</h2>
      <p class="text-sm text-gray-600 mt-2">현재 계정은 결제 상태가 <b>complete</b>가 아닙니다. 결제 후 이용 가능합니다.</p>
      <button id="btn-request" class="mt-4 px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700">결제 안내</button>
    </section>

    <section id="content" class="hidden bg-white border border-gray-200 rounded-2xl p-6">
      <h2 class="text-lg font-bold text-gray-900">강의 콘텐츠</h2>
      <p class="text-sm text-gray-600 mt-2">이 영역에 강의 자료/링크를 넣으시면 됩니다.</p>
    </section>
  </main>

  <script src="./config.js"></script>
  <script type="module" src="./classroom.js"></script>
</body>
</html>
